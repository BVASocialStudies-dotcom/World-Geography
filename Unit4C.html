<style>
:root{
  color-scheme: light;
  --bg:#E9EDF2; --panel:#FFFFFF; --ink:#1E2433; --muted:#5A6275; --line:#D3D9E2; --bar:#FFFFFF;
  --valley:#B8701F; --hawaiian:#127A78; --southern:#A8432F; --genz:#6E45C9; --millennial:#C2386C;
  --jazz:#9A7612; --twenties:#24704F; --riverboat:#285A86;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#161A22; --panel:#20252F; --ink:#E8EBF1; --muted:#A4ACBC; --line:#363D4B; --bar:#1C2129;
    --valley:#E39A4A; --hawaiian:#3FC1BD; --southern:#E07A62; --genz:#A688F0; --millennial:#EC6E9C;
    --jazz:#D9B13E; --twenties:#5BC08F; --riverboat:#6FA6DA;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161A22; --panel:#20252F; --ink:#E8EBF1; --muted:#A4ACBC; --line:#363D4B; --bar:#1C2129;
  --valley:#E39A4A; --hawaiian:#3FC1BD; --southern:#E07A62; --genz:#A688F0; --millennial:#EC6E9C;
  --jazz:#D9B13E; --twenties:#5BC08F; --riverboat:#6FA6DA;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1.0625rem/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
nav{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav ul{list-style:none;margin:0 auto;padding:0 .75rem;max-width:1120px;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:thin}
nav a{display:block;white-space:nowrap;padding:.9rem .8rem .75rem;color:var(--muted);text-decoration:none;font-weight:700;border-bottom:4px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--c);border-bottom-color:var(--c)}
nav a:focus-visible{outline:3px solid var(--c);outline-offset:-3px;border-radius:.3rem}
.wrap{max-width:1120px;margin:0 auto;padding:2.25rem 1.25rem 4rem}
.site{color:var(--muted);margin:0 0 .4rem;font-size:.95rem}
h1{font:800 clamp(2.2rem,6vw,3.6rem)/1.02 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0;color:var(--c)}
.count{color:var(--muted);margin:.4rem 0 1.75rem}
.list{background:var(--panel);border:1px solid var(--line);border-top:.5rem solid var(--c);border-radius:.5rem;margin:0;padding:.25rem 0}
.row{display:grid;grid-template-columns:minmax(10rem,16rem) 1fr;gap:.4rem 1.5rem;padding:.85rem 1.25rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{font:800 1.12rem/1.3 "Bricolage Grotesque",system-ui,sans-serif}
dd{margin:0;max-width:68ch}
dd .ex{display:block;margin-top:.3rem;font-style:italic;color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:.5rem;padding:2rem 1.25rem;color:var(--muted)}
@media (max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

ance, usually from unattractive to very attractive."], ["Goals", "A term used to describe what someone wants in their life (i.e., \"Couple goals, etc.)"], ["High-Key", "Used to describe one's thoughts, desires, or feelings in a proclaiming, exclamatory manner. The opposite of \"low-key.\""], ["Hits Different", "A positive phrase that emphasizes how good something is. For example, \"My coffee at home is good, but Starbucks hits different.\""], ["HMU", "An acronym for \"hit me up,\" which could refer to hanging out, texting, or talking on the phone."], ["Iconic", "Something that is highly influential or unique, like works of art, artists, performers, etc."], ["I'm Dead (or just \"Dead\")", "A reaction to someone being funny. A replacement for LMAO."], ["Leaving Someone on Read / Leaving Someone on Opened", "A cold shoulder. Refers to opening a message and not responding, while the sender can see that you opened it."], ["Let's Get This Bread!", "A pep talk expression similar to \"Let's do this! We got this, guys!\" (Editor's Note: Has absolutely NOTHING to do with bread.)"], ["Lit", "When something is amazing or popping."], ["Low-Key", "Used to describe one's thoughts, desires, or feelings in a subtle way."], ["Me", "Another way of saying \"Me too; I can relate to that.\""], ["Mood", "Used in lieu of \"same here;\" relatable; summing up one's life."], ["No U", "A deflection; basically the modern version of \"I know you are, but what am I?\""], ["OK Boomer", "A bit controversial with the elder generations, this one is Generation Z's dismissive response to suggestions from anybody older. E.g.: \"You should get a checkbook for your bank account.\" \"OK Boomer.\" (insert eyeroll 🙄)"], ["Oof", "The same as \"yikes.\" When you don’t really care but should at least say something."], ["Period / Periodt / Perioddddd", "A form of emphasis at the end of a phrase; often used as a \"call and response.\" E.g., Person 1: \"I feel like I'm looking cute today!\" Person 2: \"Periodddd!\ ig.\""], ["Clams", "Mistakes while playing music.", "Charlie is really layin' down some \"clams\" tonight."], ["Clinker", "A bad note or one that is fluffed.", "Hey, Charlie, that was some \"clinker\" that you just hit."], ["Combo", "Combination of musicians that varies in size from 3 to 10.", "Here me talkin' to ya Lester. Did you see that supreme \"combo\" that the Hawk put together?"], ["Cool", "A restrained approach to music. A superlative which has gained wide acceptance outside of jazz.", "That cat Miles Davis plays some \"cool\" jazz. That cat Miles, is \"cool.\""], ["Corny, Cornball", "A jazz man's term for trite, sweet or stale.", "Man, Guy Lombardo is one \"corny\" cat. Man, Guy Lombardo plays some \"cornball\" music."], ["Crazy", "Another jazz superlative.", "Count Basie's band sure lays down a \"crazy\" beat."], ["Crib", "Same as pad.", "Hey, baby, come on up to my crib awhile and relax."], ["Crumb", "Someone for whom it is impossible to show respect.", "Sleazy Eddie is a real \"crumb.\""], ["Cut", "To leave or depart. Also to completely outdo another person or group in a battle of the bands.", "Hey, man, did you see the way that two-bit band \"cut\" when Basie \"cut\" them last night."], ["Dad, Daddy-o", "A hipster's way of addressing another guy.", "Hey, \"daddy-o,\" what's cookin.'"], ["Dark", "Angry or upset (used in the Midwest).", "Joe was in a real \"dark\" mood after Jaco showed up 30 minutes late for the gig."], ["DeeJay, Disk Jockey", "An announcer of records on radio.", "Man, he is one crazy \"deejay\". He spins some cool disks."], ["Dig", "To know or understand completely.", "Hey, dad, I been listenin' to what you been doin' and I \"dig\" that crazy music."], ["Down by law", "is to have paid dues; that is, to have earned respect for your talent or ability to \"get down.\"", "Charlie Parker spent years on the road working a lot of dives to fine-tune his craft. He earned every bit of success and recognition he later received. He was \"down by law.\""], ["Drag", "As a verb—to depress or bring down a person's spirits or, as a noun—a person or thing which depresses.", "Let's get outta here, that guy is a real \"drag.\""], ["Finger Zinger", "Someone who plays very fast.", "Ignasio the new guitarist is a finger zinger on the guitar. Damn, that boy is incredible!"], ["Flip", "A verb meaning to go crazy or a noun meaning an eccentric.", "That dude is really cooking, I think he's going to \"flip.\""], ["Fly", "Smooth or slick.", "Hey, Eddie, did you see the hat-check girl Bernice? Man, she is \"fly..\""], ["Fracture", "To inspire or move someone.", "You are the funniest guy I know. When you start to tell a joke, it \"fractures\" me."], ["Funky", "Earthy or down-to-earth.", "That George Clinton is one \"funky\" cat."], ["Gas", "As a noun—something that moves you. As a verb—to stir up feelings.", "The way that guy beats the skins is a real \"gas.\""], ["Gate", "Early term for a Jazz musician.", "Armstrong is the original Swing Jazz player that's why they call used to call him \"Gate.\""], ["Get Down", "To play or dance superlatively with abandon.", "Jaco can really \"get down\" on the 4-string."], ["Gig", "A paying job.", "I'm playing a gig in the city tonight."], ["Gone", "Yet another Jazz superlative.", "Lester is a real \"gone\" cat."], ["Goof", "Fail to carry out a responsibility or wander in attention.", "Hey, Leroy, stop \"goofin'\" when I'm talkin' to ya."], ["Groovy", "Used in the fifties to denote music that swings or is funky. For a short while in the sixties, groovy was synonymous with cool. The word has been used little since the seventies.", "Hey, Jack, dig that \"groovy\" beat."], ["Gutbucket", "Gutbucket refers to something to store liquor in and to the type of music associated with heavy drinking. An early term for lowdown or earthy music.", "That cat Satchmo started out playing some real \"gutbucket\" in the houses down in New Orleans."], ["Hand me that skin", "(later modified to Hand me some skin) ---A big expression for \"shake, pal.\"", "Hey, whaddya say Rufus, \"hand me some skin.\""], ["Head or Head Arrangement", "An arrangement of a song that is not written, but remembered by the band members (the tune and progression to improvise on).", "Man, Basie's band uses a lot of \"heads,\" not those written arrangements. That's why his band really cooks."], ["Hep/Hip", "A term once used to describe someone who knows or understands. Replaced by \"hip\" about the same time that cool replaced hot. Some sources believe that \"Hep\" was the surname of a Chicago gangster of the 1890's.", "Dipper Mouth Armstrong is a \"hep\" cat."], ["Hide hitter", "—drummer.", "The hide hitter didn't show, so we had to make it a duo."], ["Hipster", "A follower of the various genres of bop jazz in the 50's. These were the precursors of hippies in the 60's.", "Those \"hipsters\" that hang out at Shelly's Manne-Hole are really diggin' the West Coast sound."], ["Horn", "Any instrument (not necessarily a brass or reed instrument).", "That dude can sure blow his \"horn..\""], ["Hot", "A term once used to describe \"real\" jazz. Replaced as a superlative by \"cool\" in the late 40's or early 50's.", "Satchel Mouth Armstrong played some really \"hot\" jazz in the 20's."], ["A Hot Plate", "A hot recording.", "Boys, I think we got ourselves a \"hot plate.\""], ["I'm Booted", "I'm hip or I understand.", "It's cool, man, I know just what you mean, \"I'm booted.\""], ["In the Mix", "Put it together, make it happen.", "Put that cat \"in the mix,\" we need a drummer for our upcoming tour."], ["In the Pocket", "Refers to the rhythm section being really together as in...", "Those guys are really in the pocket, tonight."], ["Jam/Jam Session", "To improvise.", "The band is \"jammin'\" inside right now."], ["Jazz", "The music which is discussed here. May have come from the French jaser—to chatter. May have come from Jasbo Brown—a dancer.", "The 1920's was declared the Age of \"Jazz.\""], ["Jazz Box", "a jazz guitar.", "The Ibanez PM model was developed in conjunction with Pat Metheny to meet his demand for a true \"jazz box\""], ["Jitterbug", "A jumpy, jittery energetic dance or one who danced this dance during the swing period.", "Artie Shaw is a hot clarinetist. He sure has all of the \"jitterbugs\" jumpin.'"], ["Jive", "A versatile word which can be used as a noun, verb or adjective. Noun—an odd form of speech. Verb—to fool someone. Adjective—phoney or fake.", "Old Satchmo can lay down some crazy \"jive.\" Don't \"jive\"me man, I wasn't born yesterday. That cat is one \"jive\" dude."], ["Joe Below", "A musician who plays under-scale.", "How can you expect to make a buck when \"Joe Below\" almost plays for free?"], ["Jump", "To swing.", "Let's check out that bar over there. It sounds like the joint is \"jumpin.'\""], ["Kill", "To fracture or delight.", "You \"kill\" me, man, the way you're always clowning around."], ["Lame", "Something that doesn't quite cut it.", "Some of the cats that claim to be playin' Jazz these days are layin' down some \"lame\" music."], ["Licks, hot licks", "An early term for phrase or solo.", "Louie can really lay down some \"hot licks.\""], ["Licorice Stick", "Clarinet", "Gee, Jody, doesn't it \"chill 'ya\" the way Benny plays that \"licorice stick\"?"], ["Lid", "Hat.", "Hey man, nice lid. \"Lid\" has also entered the world of hip-hop slang via a company called Ultimate Lids that makes hats."], ["Moldy Fig", "During the Bop era, fans and players of the new music used this term to describe fans and players of the earlier New Orleans Jazz.", "What do you expect, Eddie is a \"moldy fig\" and he'll never dig the new sounds."], ["My Chops is beat", "When a brass man's lips give out.", "Too many high C's tonight, man, \"my chops is beat!!\""], ["Noodlin'", "—To just play notes that have no particular meaning to a tune or solo.", "Quit \"noodlin\" cat, let's start working the tune."], ["Out of this world", "A superlative which is no longer in common use.", "I'm tellin' ya, man, the way Benny Goodman blows is \"out of this world.\""], ["Out to Lunch", "Same as lame.", "That guy is \"out to lunch,\" I can't stand the way he plays."], ["Pad", "House, home, apartment or bed.", "Hey, Lester, c'mon up to my \"pad\" you look like you need to cool down."], ["Popsicle Stick", "A saxophonist's reed.", "I'm playing a great popsicle stick."], ["Rock", "To swing or jump (as in Jump bands—the fore-runners of Rock and Roll bands).", "Louis Jordan's band really \"rocks.\""], ["Rock and Roll", "Of course the new music of the 50's, but originally slang for sex.", "Hey, baby, you're drivin' me crazy, let's \"rock and roll.\""], ["Rusty Gate", "Someone who can't play.", "That cat swings like a rusty gate."], ["Scat", "Improvise lyrics as nonsense syllables. Said to have originated on the \"Hot Five\" song \"Heebie Jeebies\" when Louis Armstrong dropped his lyrics.", "I can really dig Dizzy's new way of singing \"scat.\""], ["Scene", "A place or atmosphere.", "In the late twenties, Armstrong was the man on the New York \"scene.\""], ["Schmaltz or Schmalz", "It's the Yiddish word for chicken fat, and has been a slang term in the U.S. since the '20s for anything sickeningly sweet or \"greasy,\" especially music or poetry.", "That Lombardo guy is popular, but he sure plays a lot of \"schmaltz.\""], ["Screwin' the Pooch", "Really bad mistakes while playing music.", "Roscoe must've had a bad day, cause he's really \"screwin' the pooch.\""], ["Send", "to move or to stimulate.", "Roscoe, you really \"send\" me."], ["Sharp", "Fashionable.", "Hey, Rufus, that's one \"sharp\" looking suit of clothes you're sportin' there."], ["Sides", "Records.", "We sat around and dug \"sides.\" Or, as George Crater (or was it Ira Gitler?) once put it, \"I sat around with another musician and Doug Sides.\" ~ Bob Blumenthal"], ["Skins player", "The drummer. (Skins comes from the days when cowhide or other dried animal skin was used to make drum heads.)", "Man, we were all ready to have a little improv jam session but our \"skins player\" skipped out on us. There's one cat that I'm gonna skin!"], ["Smokin'", "Playing your butt off.", "I can already tell from outside that Jimmy is \"smokin'\" tonight."], ["Solid", "A swing-era superlative which is little used today.", "Little Jazz can blow up a storm, he's really \"solid.\""], ["Split", "To leave.", "Sorry I can't stick around Slick, I gotta \"split.\""], ["Square", "A somewhat outmoded term meaning unknowing which can be a noun or a verb.", "That cat is a real \"square\""], ["Sraw Boss", "It refers to the lead alto player in a big band, being the dude who leads all the other saxophones, knows all of the answers and takes care of the crew.", ""], ["Sugar band", "A sweet band; lots of vibrato and glissando.", ""], ["Swing", "to get a rocking or swaying beat.", "Ellington's band \"swings\" like no other. It's elegant."], ["Tag", "Used to end the tune, repeating the last phrase three times.", ""], ["Take five", "A way of telling someone to take a five minute break or to take a five minute break.", "Hey, Cleanhead, this is a cool tune and we're blowin' too hot. We oughta \"take five.\""], ["Too much", "Just one more jazz superlative. Originally something so good, that it is hard to take.", "Art Blakey is a fantastic drummer. His playing is \"too much.\""], ["Torch", "Used occasionally as a description of a song that expresses unrequited love.", "Nobody could sing \"torch\" songs like Peggy Lee."], ["Train Wreck", "Event during the playing of a tune when the musicians \"disagree\" on where they are in the form (i.e. someone gets lost), so the chord changes and the melody may get confused for several bars, but depending on the abilities of the musicians (it happens to the best of them), there are usually no fatalities and the journey continues.", ""], ["Tubs", "Set of drums.", "Jo is really hot tonight. Listen to him pound those \"tubs.\""], ["Two beat", "Four-four time with a steady two beat ground beat on the bass drum. New Orleans Jazz.", "I can't dig this \"two beat\" jazz. My boys got to have four even beats to the measure."], ["Wail", "To play a tune extremely well.", "Count Basie did a tune called \"Prince of Wails\"—a clever play on words. Damn, Basie's band can really \"wail.\""], ["Walking bass or walking rhythm", "an energetic four-beat rhythm pattern.", "I really dig the way Earl plays the 88's. He plays the tune with his left hand and a \"walking bass\" with his right."], ["Wax a disc", "Cut a record.", "I just \"waxed a disc\" up at Rudy Van Gelder's studio with Jimmy Smith."], ["Wig, Wig out", "To flip out. Also to think precisely.", "I don't know what happened, man, we were just sittin' there and Louie just \"wigged out.\""], ["Wild", "Astonishing or amazing.", "It's really \"wild\" the way Lee plays the trumpet."], ["Woodshed (or Shed)", "To practice.", "Duke was up all night shedin' that untouchable lick."], ["Zoot", "Used in the thirties and forties to describe exaggerated clothes, especially a zoot suit.", "Look at that cat's \"zoot\" suit. It's crazy, man."]]], ["millennial", "Millennial Slang", [["Bae", "The internet argues that this phrase is an acronym for “before anyone else,” another way of describing that special someone. And while it is synonymous with “sweetheart” or “baby,” its roots likely stem from African-American Vernacular English, a term linguists use to describe words that originated in Black culture."], ["Basic", "Anything mainstream is considered basic. Pumpkin spice lattes, for instance, are basic (to some). Viral YouTube videos are credited for introducing the world to the phrase, though musical groups such as Klymaxx used the word in the '80s."], ["Beat", "This slang term isn’t as aggressive as it sounds. “Beat” can be used as a verb or adjective, and it’s all about beauty. To beat is to apply makeup, and if someone is described as being “beat,” it means they either applied their makeup well, or just applied a lot of it. Used in a sentence as a verb: “I have to meet the parents tonight so I’m going to beat my face.” You'll find examples of \"beat\" in the ball culture documentary Paris Is Burning."], ["Clock", "No, this has nothing to do with time. As Merriam-Webster defines the verb, to clock is to “hit hard.” Therefore, if you clock, are clocking, or clocked, someone, you essentially strike them across the head with an insult. It’s similar to a “read,” but slightly more aggro. The slang version derives from ball culture, too."], ["Dead", "As slang, it means that something is so funny or ridiculously good it's forced you to be hyperbolic. Did you see that scene in that incredible Netflix comedy? I’m dead."], ["Extra", "As Urban Dictionary defined it in 2003, something must be considered “over the top” to be extra."], ["G.O.A.T.", "Here’s an easy one: G.O.A.T. is an acronym for greatest of all time. Commonly referenced in sports, the term is traced back to boxer Muhammad Ali."], ["Gucci", "Yes, Gucci is the name of a luxury Italian fashion label, but its use in hip-hop songs like D&D’s “What’s Gucci” has made it synonymous with “good.\" It can help reflect a feeling (“I’m Gucci!”) or can be used as an adjective for something you love (“That’s so Gucci!”)."], ["Keep It 100", "This one also originated in Black culture and it basically means to be authentic. Musicians like Gucci Mane and Drake are credited for using it in their music first, and it hit the mainstream in the 2010s thanks to a segment on Larry Wilmore’s The Nightly Show called just that."], ["Lit", "A common way of describing drunken behavior, the history of lit predates modern culture. The slang was first used in John McGavock Grider’s 1918 book, War Birds: Diary of an Unknown Aviator. Often whipped out in a party context, it’s now a replacement for “really good.\""], ["Low Key", "For something to be low key, it must be secretive or “kinda” what you actually want. Used in a sentence: “I might order the salad, but I’m low key craving the pasta.”"], ["Mood", "This picked up steam around 2015, when memes took off in the Internet. According to the Daily Dot, mood specifically is derived from Black culture and it's used next to a meme, video, or photo to emphasize that something is relatable. This feel-good clip of Lisa and Bart Simpson dancing, for example, is a mood."], ["No Cap", "Listed without a definition in the source. See Gen Z: \"No cap\" means you're not lying."], ["On Fleek", "This can be used as a replacement for \"on point,\" meaning something has been immaculately executed. Specifically, a 2014 Vine video in which a woman describes her eyebrows as \"on fleek\" is what brought it into the mainstream. Today, it's used far beyond the context of eyebrows."], ["Ratchet", "This is generally used to describe someone as obnoxious, rude, or trashy, though it’s also interchangeable with “cool” in a different context. Its origin is often traced back to Shreveport, Louisiana, where the song “Do Da Ratchet” is thought to have popularized the term in the early 2000s."], ["Read", "Used as a verb, a “read” is essentially an insult, and a catty way of calling out someone’s flaws. The slang term derives from both the Black and LGBTQ communities, and is also regularly used in Paris Is Burning. Mariah Carey’s “I don’t know her” line about J.Lo is the ultimate read."], ["Realness", "Once again, in ball culture, drag queens participate in voguing competitions during which they're judged for how authentically they can emulate a character’s look. The more you mimic someone’s demeanor, the closer you’ve gotten to achieving realness. So if the idea is to look like a Wall Street banker, your goal is to serve (that is, deliver) “Executive Realness.”"], ["Receipts", "It's all about accountability here. Asking someone to show you the receipts essentially means you want proof. As Slate points out, the term is borrowed from Black culture."], ["Salty", "Can be used to describe something witty, racy, coarse, and humorous—and so folks use salty in relation to bitter behavior. If someone is acting salty towards you, they are likely upset."], ["Savage", "To perform a savage act is to do so unapologetically. This word is used as internet slang when describing a shocking event or a careless attitude. Unfortunately, it was initially introduced as a derogatory way of describing Native Americans."], ["Shade", "You can “throw shade” or “be shady,” in other words, subtly (or indirectly) disrespect someone. Stemming from queer culture, again, Paris Is Burning captures the art of it. In the film, drag performer Dorian Corey puts it this way: “Shade is, I don’t have to tell you you’re ugly, but I don’t have to tell you because you know you’re ugly.” Shade."], ["Shook", "While the term became popularized in '90s hip-hop and R&B music, it's technically old English, the past tense of shake. To feel shook is to be shaken up by something, for better or worse. The 2017 clip of comedian Christine Sydelko saying \"I am shooketh!\""], ["Skrt", "As Urban Dictionary points out, this word is used to describe the sound tires make when you stop unexpectedly. In conversation, it's a synonym for \"stop.\" If a friend is gossiping and you'd like them to revisit part of the story, for example, you can quickly interject with \"skrt!\""], ["Slaps", "Now colloquially used to describe something—a song, your meal, new shoes, anything—that strikes you as good, that's impressive.. This new recipe from Oprah's plant-based diet slaps."], ["Slay", "Slay is to do something exceptionally well. While Merriam-Webster defines it as, “to kill violently,” and traces its etymology to the 12th century, the term as a form of slang picked up steam in—surprise—‘80s and ‘90s ball culture, where LGBTQ people of color used it to compliment someone’s outfit or demeanor."], ["Stan", "The Oxford English Dictionary describes a stan as an “overzealous or obsessive fan of a particular celebrity.” Yep. The song picked up steam after Eminem."], ["Swerve", "While there are several definitions, to swerve is to avoid something, or steer clear of an unwanted situation. Similarly to other terms on this list, it's been historically used in Black culture. And more specifically, it was famously used in the song \"Mercy\" featuring Kanye West, Big Sean, Pusha T, and 2 Chainz."], ["TBH", "This is an acronym for to be honest. Often, it's used for emphasis while admitting something about yourself. An example? I really love Lady Gaga, tbh."], ["Tea", "Tea is all about exchanging hot gossip. You can get tea, spill tea, and give tea. Often, the term is simply interchangeable with the letter “T.\" This slang term—like so many on this list—derives from '80s and '90s ball culture."], ["Thirsty", "To be “thirsty” is to desperately want approval..”"], ["Woke", "If you’ve kept up with the latest political headlines and aren't afraid to have an opinion against them, you’re likely “woke.” The term also originates in Black culture, and Erykah Badu's \"Master Teacher\" is believed to be where it was uttered for the first time in the mainstream. You might have also heard Congresswoman Barbara Lee use it in 2017. “We have a moral obligation to ‘stay woke,’ take a stand and be active,” she said, which got her quoted in the dictionary."], ["Yas", "To express praise for something or someone, a simple \"yas,\" will do."]]], ["southern", "Southern Slang", [["Aren't you precious", "Sweet or cute"], ["As pretty as a peach", "Very pretty"], ["Bless your heart", "Poor you"], ["Bouta", "About to"], ["Buggy", "Shopping cart"], ["Can't never could", "Encouragement (if you do not believe then you can't)"], ["Down yonder", "Over there"], ["Fixin'", "Going to"], ["Gimme some sugar", "Give love"], ["Hankerin", "Intense craving"], ["Hold your horses", "Wait a minute"], ["Hush your mouth", "Shut up"], ["I reckon", "I bet"], ["Ight", "Alright"], ["Its blowin up a storm", "The storm is harsh"], ["Madder than a wet hen", "Very mad"], ["Might could", "Maybe"], ["Pitchin a hissy fit", "Temper tantrum"], ["Pop or Coke", "Any soda"], ["Y'all", "You all"]]], ["valley", "Valley Girl Slang", [["As if", "Lit. \"as if\" except it does not use a subject; expresses disbelief."], ["Bag your face", "Shut up"], ["Barf me out!", "\"So disgusting it makes me want to vomit.\""], ["Bogus", "Not true or fake"], ["Doy", "Duh"], ["Fer shur", "Lit. \"For sure\""], ["Gag me with a spoon!", "Expression of disgust"], ["Grody to the max!", "\"As gross as he/she/it can be.\""], ["I'm suuure! or I'm so sure", "\"I'm absolutely positive,\" but usually used sarcastically."], ["In another life", "Definition not provided."], ["Like, oh my God", "Can be used many ways; expresses shock (OMG for short)."], ["Seriously", "Frequent interjection of approval."], ["So", "Very; used too often and said with too much emphasis. \"He's so not cute!\""], ["Take a chill pill", "Relax"], ["Totally", "\"I agree\" or \"completely.\""], ["Whatever!", "Short for \"whatever you say\"; sarcastic comeback."]]]];
const nav = document.getElementById('nav');
const page = document.getElementById('page');
CATS.forEach(([id, name]) => {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = '#' + id; a.textContent = name.replace(' Slang', '');
  a.style.setProperty('--c', `var(--${id})`);
  li.appendChild(a); nav.appendChild(li);
});
function render() {
  const id = location.hash.slice(1);
  const cat = CATS.find(c => c[0] === id) || CATS.find(c => c[2].length) || CATS[0];
  const [cid, name, terms] = cat;
  document.documentElement.style.setProperty('--c', `var(--${cid})`);
  document.title = name + ' – Slang Across Eras and Cultures';
  nav.querySelectorAll('a').forEach(a => {
    if (a.hash === '#' + cid) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({block:'nearest', inline:'nearest'}); }
    else a.removeAttribute('aria-current');
  });
  page.replaceChildren();
  const site = document.createElement('p'); site.className = 'site'; site.textContent = 'Slang across eras and cultures';
  const h = document.createElement('h1'); h.textContent = name;
  const c = document.createElement('p'); c.className = 'count';
  c.textContent = terms.length ? terms.length + ' terms' : 'No terms added yet';
  page.append(site, h, c);
  if (!terms.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'This list hasn’t been added yet.';
    page.append(e);
  } else {
    const dl = document.createElement('dl'); dl.className = 'list';
    terms.forEach(([term, def, ex]) => {
      const row = document.createElement('div'); row.className = 'row';
      const dt = document.createElement('dt'); dt.textContent = term;
      const dd = document.createElement('dd'); dd.textContent = def;
      if (ex) { const s = document.createElement('span'); s.className = 'ex'; s.textContent = 'Example: ' + ex; dd.append(s); }
      row.append(dt, dd); dl.append(row);
    });
    page.append(dl);
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
