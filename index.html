<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style id="app-style">
:root{
  --paper:#F3F6F5;--surface:#FFFFFF;--ink:#16242B;--muted:#56666E;--line:#C9D5D6;--ocean:#1F5E7A;--focus:#1F5E7A;
  --u1:#2E6F95;--u2:#3F9296;--u3:#5E9446;--u4:#A69A2E;--u5:#C0803A;--u6:#8E5B3C;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1B21;--surface:#15252D;--ink:#E4ECEC;--muted:#93A5AB;--line:#2A3C44;--ocean:#6FB2CF;--focus:#8CC8E0;
  --u1:#5B9CC4;--u2:#5DB5B3;--u3:#80B864;--u4:#CFC05A;--u5:#DDA05C;--u6:#C08A68;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1B21;--surface:#15252D;--ink:#E4ECEC;--muted:#93A5AB;--line:#2A3C44;--ocean:#6FB2CF;--focus:#8CC8E0;
  --u1:#5B9CC4;--u2:#5DB5B3;--u3:#80B864;--u4:#CFC05A;--u5:#DDA05C;--u6:#C08A68;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:24px;padding:clamp(28px,6vw,72px) 0 clamp(20px,4vw,40px)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,11vw,7.5rem);line-height:.86;letter-spacing:-.01em;margin:0 0 18px}
.hero h1 span{display:block}
.hero p{margin:0;max-width:34ch;color:var(--muted);font-size:1.15rem}
.globe{width:100%;max-width:340px;justify-self:end;color:var(--ocean)}
.globe .g{fill:none;stroke:currentColor;stroke-width:1}
.globe .rim{stroke-width:2}
.globe .eq{stroke-width:1.6}
.globe .trop{stroke-dasharray:3 4}

/* Unit index */
.index{display:flex;flex-wrap:wrap;gap:6px 22px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:clamp(28px,5vw,48px)}
.index a{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;padding:4px 0}
.index a:hover{text-decoration:underline;text-underline-offset:4px}
.swatch{width:14px;height:14px;border-radius:3px;background:var(--c);flex:none}

/* Units */
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,32px);padding-bottom:64px}
.unit{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:4px 4px 10px 10px;padding:22px clamp(18px,2.5vw,26px) 18px;scroll-margin-top:16px}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.unit-num{font-family:var(--display);font-weight:600;color:var(--c);font-size:1.05rem;margin:0}
.unit h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3.4vw,2.3rem);line-height:1;margin:4px 0 8px}
.unit .blurb{font-style:italic;color:var(--muted);margin:0 0 16px;max-width:48ch}
.spots{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.spot{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.spot-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:11px 4px;color:inherit;text-decoration:none}
a.spot-open:hover .spot-title{text-decoration:underline;text-underline-offset:3px}
.pin{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1rem;border:2px solid var(--c);color:var(--c)}
.filled .pin{background:var(--c);color:var(--surface)}
.spot-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty .spot-title{color:var(--muted);font-style:italic}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .globe{justify-self:start;max-width:180px;grid-row:1}
  .units{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<!--
  HOW TO ADD A PAGE
  1. Upload your .html file to this repository (for example into a folder named unit-1).
  2. Add a line to the "lessons" list of the matching unit below:
       {"title": "Reading a topographic map", "file": "unit-1/topographic-maps.html"}
     Separate lessons with commas. "file" is the path to the file inside this repository.
  3. Commit. The link appears on this page once GitHub Pages rebuilds (about a minute).
-->
<script type="application/json" id="units">
{"units": [
  {
    "title": "The geographer's toolkit",
    "blurb": "Maps, projections, latitude and longitude, and the five themes of geography.",
    "lessons": []
  },
  {
    "title": "Earth's physical systems",
    "blurb": "Landforms, plate tectonics, climate zones and biomes.",
    "lessons": []
  },
  {
    "title": "People and places",
    "blurb": "Population, migration, culture, and how people reshape the land.",
    "lessons": []
  },
  {
    "title": "The Americas",
    "blurb": "From the Canadian Shield to Patagonia.",
    "lessons": []
  },
  {
    "title": "Europe and Africa",
    "blurb": "Peninsulas and rift valleys, great rivers and the Sahel.",
    "lessons": []
  },
  {
    "title": "Asia and Oceania",
    "blurb": "Monsoons, megacities, island arcs and the wide Pacific.",
    "lessons": []
  }
]}
</script>

<script>
(function(){
  var data;
  try { data = JSON.parse(document.getElementById('units').textContent); }
  catch(e){ data = {units:[]}; console.error('The unit list in index.html is not valid JSON:', e); }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function href(file){ return String(file).split('/').map(encodeURIComponent).join('/'); }
  function label(l){
    if(l.title && String(l.title).trim()) return l.title;
    return String(l.file||'').split('/').pop().replace(/\.html?$/i,'').replace(/[-_]+/g,' ');
  }

  function globeSVG(){
    var r=140, parts=[];
    [0,35,70,105].forEach(function(rx){ parts.push(rx===0?'<line class="g" x1="0" y1="-140" x2="0" y2="140"/>':'<ellipse class="g" cx="0" cy="0" rx="'+rx+'" ry="140"/>'); });
    [-105,-70,-35,35,70,105].forEach(function(y){ var w=Math.sqrt(r*r-y*y); var cls=(Math.abs(y)===35)?'g trop':'g'; parts.push('<line class="'+cls+'" x1="'+(-w).toFixed(1)+'" y1="'+y+'" x2="'+w.toFixed(1)+'" y2="'+y+'"/>'); });
    parts.push('<line class="g eq" x1="-140" y1="0" x2="140" y2="0"/>');
    parts.push('<circle class="g rim" cx="0" cy="0" r="140"/>');
    return '<svg class="globe" viewBox="-160 -160 320 320" role="img" aria-label="A globe drawn with lines of latitude and longitude, tilted on its axis"><g transform="rotate(23.4)">'+parts.join('')+'<line class="g" x1="0" y1="-158" x2="0" y2="-140"/><line class="g" x1="0" y1="140" x2="0" y2="158"/></g></svg>';
  }

  var units=data.units||[];
  var idx=units.map(function(u,i){ return '<a href="#unit-'+(i+1)+'" style="--c:var(--u'+((i%6)+1)+')"><span class="swatch"></span>Unit '+(i+1)+'</a>'; }).join('');
  var sections=units.map(function(u,i){
    var lessons=(u.lessons||[]).filter(function(l){ return l && l.file; });
    var items=lessons.length ? lessons.map(function(l,j){
      return '<li class="spot filled"><a class="spot-open" href="'+esc(href(l.file))+'"><span class="pin">'+(j+1)+'</span><span class="spot-title">'+esc(label(l))+'</span></a></li>';
    }).join('') : '<li class="spot empty"><span class="spot-open"><span class="pin">&ndash;</span><span class="spot-title">Nothing posted yet</span></span></li>';
    return '<section class="unit" id="unit-'+(i+1)+'" style="--c:var(--u'+((i%6)+1)+')">'+
      '<div class="unit-head"><p class="unit-num">Unit '+(i+1)+'</p></div>'+
      '<h2>'+esc(u.title||'')+'</h2><p class="blurb">'+esc(u.blurb||'')+'</p><ol class="spots">'+items+'</ol></section>';
  }).join('');

  document.getElementById('root').innerHTML=
    '<div class="wrap">'+
      '<header class="hero"><div><h1><span>World</span><span>Geography</span></h1><p>'+units.length+' units, from reading a map to reading the world. Choose a unit to find its lessons, maps and activities.</p></div>'+globeSVG()+'</header>'+
      '<nav class="index" aria-label="Units">'+idx+'</nav>'+
      '<main class="units">'+sections+'</main>'+
    '</div>';
})();
</script>
</body>
</html>
